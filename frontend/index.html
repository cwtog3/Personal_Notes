<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Kudry&family=Lora:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/main.css">
    <title>Дневник рефлексии</title>
</head>
<body>
    <input type="checkbox" id="menu-toggle" class="visually-hidden">
    <label for="menu-toggle" class="menu-button">☰</label>
    <aside class="sidebar">
        <nav>
            <ul>
                <li><a href="index.html">Главная</a></li>
                <li><a href="notes.html">Мои заметки</a> </li>
                <li><a href="statistic.html">Статистика</a></li>
            </ul>
        </nav>
    </aside>

    <main class="main-content">
        <img
            src="images/star.png"
            alt=""
            class="logo">
        <header class="main-header">

            <h1>Вопрос дня</h1>
        </header>
        <section class="question-section">
            <p class="question-text">Как вы чувствуете себя сегодня?</p>
            <form action="#" method="post">
                <label for="answer" class="visually-hidden">Ваш ответ</label>
                <textarea id="answer" name="answer" placeholder="Напишите ваши мысли здесь..."></textarea>
                <button type="submit">Сохранить</button>
            </form>
        </section>
        <section class="recent-notes">
            <h2>Последние заметки</h2>
            <ul class="notes-list">
                <li class="note-item">
                    <p>О работе<time class="note-date" datetime="2026-10-02">02.10.2026</time></p>
                </li>
            </ul>
        </section>
    </main>

    <aside class="statistic-panel">
        <h2>Статистика</h2>
    </aside>

    <footer class="site-footer">
        <p>Дневник рефлексии, 2026</p>
        <p><a href="https://github.com/cwtog3/Personal_Notes">Репозиторий на GitHub</a></p>
    </footer>
</body>
</html>
